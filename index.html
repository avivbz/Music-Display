<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>Music-Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 4vh 4vw;
    gap: 2vh;
    height: 100vh;
  }
  #time {
    flex: 0 0 auto;
    text-align: center;
    font-size: 27vh;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #now-playing {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.4vh;
    min-height: 0;
    padding: 0 4vw;
  }
  #title {
    font-size: 8.0vh;
    font-weight: 600;
    line-height: 1.1;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  #artist {
    font-size: 5.0vh;
    font-weight: 300;
    opacity: 0.85;
    line-height: 1.1;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #source {
    font-size: 2.2vh;
    font-weight: 500;
    opacity: 0.5;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 0.5vh;
  }
  #buttons {
    flex: 0 0 auto;
    display: flex;
    gap: 6vw;
    justify-content: center;
    align-items: center;
  }
  .icon-btn {
    width: 10vh;
    height: 10vh;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { transform: scale(0.93); }
  .icon-btn svg { width: 100%; height: 100%; display: block; }
  #signin-link {
    position: fixed;
    top: 1.2vh;
    right: 1.5vw;
    font-size: 1.6vh;
    color: #1DB954;
    opacity: 0.85;
    background: transparent;
    border: 1px solid #1DB954;
    border-radius: 1vh;
    padding: 0.6vh 1.2vw;
    cursor: pointer;
    font-family: inherit;
  }
  #status {
    position: fixed;
    top: 1.2vh;
    left: 1.5vw;
    font-size: 1.4vh;
    opacity: 0.35;
    pointer-events: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="status"></div>
  <button id="signin-link" class="hidden">Sign in to Spotify</button>

  <div id="time">--:--</div>

  <div id="now-playing">
    <div id="title">Not playing</div>
    <div id="artist"></div>
    <div id="source"></div>
  </div>

  <div id="buttons">
    <button class="icon-btn" id="btn-playpause" aria-label="Play or pause">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="50" fill="#1F8FE0"/>
        <polygon points="32,28 32,72 58,50" fill="#fff"/>
        <rect x="62" y="28" width="7" height="44" rx="1.5" fill="#fff"/>
        <rect x="73" y="28" width="7" height="44" rx="1.5" fill="#fff"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-spotify" aria-label="Open Spotify">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="50" fill="#1DB954"/>
        <path d="M22 38 Q50 28 78 40" stroke="#000" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path d="M26 52 Q50 44 74 54" stroke="#000" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M30 65 Q50 59 70 67" stroke="#000" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-rp" aria-label="Open Radio Paradise" style="display:none>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3a1f6b"/>
            <stop offset="50%" stop-color="#6a3fa0"/>
            <stop offset="100%" stop-color="#8094d6"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#rp-grad)"/>
        <!-- Center "X" wave -->
        <path d="M44 32 Q50 50 44 68 M56 32 Q50 50 56 68" stroke="#fff" stroke-width="5.5" stroke-linecap="round" fill="none"/>
        <!-- Left waves -->
        <path d="M36 38 Q30 50 36 62" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M28 34 Q19 50 28 66" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="20" cy="50" r="4" fill="#fff"/>
        <!-- Right waves -->
        <path d="M64 38 Q70 50 64 62" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M72 34 Q81 50 72 66" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="80" cy="50" r="4" fill="#fff"/>
      </svg>
    </button>
  </div>

  <!-- Hidden audio element used to stream Radio Paradise from inside the page,
       so the play/pause button can actually control playback. -->
  <audio id="rp-audio" preload="none" crossorigin="anonymous"></audio>

<script>
(() => {
  // ====== Config ======
  const CLIENT_ID    = '23da5fe4e62345cb9ce601f75696bbe1';
  const REDIRECT_URI = 'https://avivbz.github.io/Music-Display/callback';
  const SCOPES       = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
  const SPOTIFY_POLL_MS = 5000;
  const RP_POLL_MS      = 15000;

  // ====== DOM ======
  const $time   = document.getElementById('time');
  const $title  = document.getElementById('title');
  const $artist = document.getElementById('artist');
  const $source = document.getElementById('source');
  const $signin = document.getElementById('signin-link');
  const $status = document.getElementById('status');

  // ====== Clock ======
  function updateClock() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    $time.textContent = `${h}:${m}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ====== State ======
  let lastSource     = localStorage.getItem('last_source') || 'spotify'; // 'spotify' | 'rp'
  let spotifyPlaying = false;
  let spotifyTrack   = null; // { title, artist }
  let rpTrack        = null; // { title, artist }

  function setStatus(s) { $status.textContent = s || ''; }

  // ====== PKCE helpers ======
  function randomString(len) {
    const arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return Array.from(arr, b => ('0' + b.toString(16)).slice(-2)).join('').slice(0, len);
  }
  async function sha256(plain) {
    const enc = new TextEncoder().encode(plain);
    return await crypto.subtle.digest('SHA-256', enc);
  }
  function b64url(buf) {
    let s = '';
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.byteLength; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // ====== Spotify auth ======
  async function spotifyLogin() {
    const verifier = randomString(64);
    localStorage.setItem('spotify_verifier', verifier);
    const challenge = b64url(await sha256(verifier));
    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: 'code',
      redirect_uri: REDIRECT_URI,
      code_challenge_method: 'S256',
      code_challenge: challenge,
      scope: SCOPES
    });
    window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
  }

  async function exchangeCode(code) {
    const verifier = localStorage.getItem('spotify_verifier');
    if (!verifier) return null;
    const body = new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    });
    try {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      const data = await res.json();
      if (data.access_token) saveTokens(data);
      return data;
    } catch (e) {
      setStatus('Token exchange failed');
      return null;
    }
  }

  async function refreshAccessToken() {
    const rt = localStorage.getItem('spotify_refresh_token');
    if (!rt) return null;
    const body = new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: rt
    });
    try {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      const data = await res.json();
      if (data.access_token) {
        saveTokens(data);
        return data.access_token;
      }
    } catch (e) {}
    return null;
  }

  function saveTokens(data) {
    localStorage.setItem('spotify_access_token', data.access_token);
    if (data.refresh_token) {
      localStorage.setItem('spotify_refresh_token', data.refresh_token);
    }
    const expiresIn = Number(data.expires_in) || 3600;
    localStorage.setItem('spotify_expires_at', String(Date.now() + (expiresIn - 60) * 1000));
  }

  async function getValidToken() {
    const tok = localStorage.getItem('spotify_access_token');
    const exp = parseInt(localStorage.getItem('spotify_expires_at') || '0', 10);
    if (tok && Date.now() < exp) return tok;
    return await refreshAccessToken();
  }

  function isAuthed() {
    return !!localStorage.getItem('spotify_access_token');
  }

  // ====== Spotify API ======
  async function spotifyApi(path, method = 'GET', jsonBody = null) {
    let token = await getValidToken();
    if (!token) return { needsAuth: true };

    const doFetch = async (t) => {
      const opts = { method, headers: { Authorization: 'Bearer ' + t } };
      if (jsonBody) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(jsonBody);
      }
      return fetch('https://api.spotify.com/v1' + path, opts);
    };

    let res;
    try { res = await doFetch(token); }
    catch (e) { return { error: 'network' }; }

    if (res.status === 401) {
      token = await refreshAccessToken();
      if (!token) return { needsAuth: true };
      try { res = await doFetch(token); } catch (e) { return { error: 'network' }; }
    }
    if (res.status === 204) return { empty: true };
    if (!res.ok) return { error: res.status };
    const txt = await res.text();
    if (!txt) return { empty: true };
    try { return JSON.parse(txt); } catch { return { empty: true }; }
  }

  // ====== Pollers ======
  async function pollSpotify() {
    if (!isAuthed()) return;
    const data = await spotifyApi('/me/player/currently-playing');
    if (data.needsAuth) {
      $signin.classList.remove('hidden');
      return;
    }
    if (data.empty || !data.item) {
      spotifyPlaying = false;
      // Keep last spotifyTrack so display can still show the last song if Spotify was the source.
      render();
      return;
    }
    spotifyTrack = {
      title: data.item.name,
      artist: (data.item.artists || []).map(a => a.name).join(', ')
    };
    spotifyPlaying = !!data.is_playing;
    if (spotifyPlaying) {
      lastSource = 'spotify';
      localStorage.setItem('last_source', 'spotify');
    }
    render();
  }

  // RP "now playing" endpoint. The list_num=1 form returns the track
  // currently airing and updates as soon as the next track starts.
  const RP_ENDPOINT = 'https://api.radioparadise.com/api/nowplaying_list?chan=0&list_num=1';

  // RP doesn't send CORS headers for cross-origin browsers, so we route
  // through public CORS proxies. Direct first (in case it ever works), then
  // proxies. Each attempt is bust-cached with a fresh timestamp so neither the
  // browser nor the proxy serves a stale response.
  const RP_PROXIES = [
    (url) => url,
    (url) => 'https://corsproxy.io/?' + encodeURIComponent(url),
    (url) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
  ];

  // Pull the most recently aired song out of whatever shape the API returns.
  function extractRPTrack(data) {
    if (!data || typeof data !== 'object') return null;

    const fromSong = (s) => (s && (s.title || s.artist))
      ? { title: s.title || '', artist: s.artist || '' }
      : null;

    // Shape A: { "0": {artist, title, ...}, "1": {...}, ... } — numeric keys
    // at the top level. The highest numeric key is the most recent.
    const numericKeys = Object.keys(data).filter(k => /^\d+$/.test(k));
    if (numericKeys.length) {
      const latest = numericKeys.map(Number).sort((a, b) => b - a)[0];
      const t = fromSong(data[String(latest)]);
      if (t) return t;
    }

    // Shape B: { song: { "0": {...}, ... } } — same idea, nested under `song`.
    if (data.song && typeof data.song === 'object') {
      const keys = Object.keys(data.song).filter(k => /^\d+$/.test(k));
      if (keys.length) {
        const latest = keys.map(Number).sort((a, b) => b - a)[0];
        const t = fromSong(data.song[String(latest)]);
        if (t) return t;
      }
      const anyKey = Object.keys(data.song)[0];
      const t = fromSong(data.song[anyKey]);
      if (t) return t;
    }

    // Shape C: array of song objects.
    if (Array.isArray(data) && data.length) {
      const t = fromSong(data[data.length - 1]) || fromSong(data[0]);
      if (t) return t;
    }

    // Shape D: flat object with title/artist directly.
    const title  = data.title  || data.song_title || data.track || '';
    const artist = data.artist || data.artist_name || '';
    if (title || artist) return { title, artist };

    return null;
  }

  async function pollRP() {
    // Cache-busting: append a fresh timestamp to the inner URL each call so
    // the proxy treats every poll as a brand-new request.
    const sep = RP_ENDPOINT.includes('?') ? '&' : '?';
    const target = RP_ENDPOINT + sep + '_t=' + Date.now();

    for (const proxy of RP_PROXIES) {
      try {
        const res = await fetch(proxy(target), { cache: 'no-store' });
        if (!res.ok) continue;
        const data = await res.json();
        const track = extractRPTrack(data);
        if (track) {
          // Only re-render if the track actually changed, to avoid flicker.
          if (!rpTrack || rpTrack.title !== track.title || rpTrack.artist !== track.artist) {
            rpTrack = track;
            render();
          }
          setStatus('');
          return;
        }
      } catch (e) {
        // try the next proxy
      }
    }
    setStatus('RP fetch failed');
  }

  // ====== Render ======
  function render() {
    let track = null;
    let source = '';

    // Priority: actively-playing Spotify > Radio Paradise (always-on stream)
    // > stale Spotify cache. RP wins over a paused Spotify because it
    // represents what's actually airing right now.
    if (spotifyPlaying && spotifyTrack) {
      track = spotifyTrack;
      source = 'Spotify';
    } else if (rpTrack) {
      track = rpTrack;
      source = 'Radio Paradise';
    } else if (spotifyTrack) {
      track = spotifyTrack;
      source = 'Spotify · paused';
    }

    if (track) {
      $title.textContent  = track.title  || '—';
      $artist.textContent = track.artist || '';
      $source.textContent = source;
    } else {
      $title.textContent  = isAuthed() ? 'Nothing playing' : 'Sign in to Spotify to begin';
      $artist.textContent = '';
      $source.textContent = '';
    }
  }

  // ====== Buttons ======
  // Radio Paradise streams (Main Mix). The page can play these directly via
  // a hidden <audio> element so the play/pause button has something to control.
  const RP_STREAM_URLS = [
    'https://stream.radioparadise.com/aac-320',
    'https://stream.radioparadise.com/aac-128',
    'https://stream.radioparadise.com/mp3-192'
  ];
  const $rpAudio = document.getElementById('rp-audio');
  let rpAudioPlaying = false;

  function rpPlay() {
    // Try each stream URL in turn — the browser picks the first one it can play.
    let i = 0;
    const tryNext = () => {
      if (i >= RP_STREAM_URLS.length) {
        setStatus('RP stream failed to start');
        rpAudioPlaying = false;
        return;
      }
      // Cache-bust to force a fresh stream connection.
      $rpAudio.src = RP_STREAM_URLS[i++] + '?_=' + Date.now();
      $rpAudio.play().then(() => {
        rpAudioPlaying = true;
        setStatus('');
      }).catch(() => tryNext());
    };
    tryNext();
  }

  function rpPause() {
    try { $rpAudio.pause(); } catch {}
    $rpAudio.removeAttribute('src');
    $rpAudio.load();
    rpAudioPlaying = false;
  }

  $rpAudio.addEventListener('pause', () => { rpAudioPlaying = false; });
  $rpAudio.addEventListener('playing', () => { rpAudioPlaying = true; });

  // Decide which source the play/pause button should act on. We use the same
  // priority as the display: live Spotify wins; otherwise RP (the always-on
  // stream); otherwise whatever Spotify cached.
  function activePlaybackSource() {
    if (spotifyPlaying) return 'spotify';
    if (rpAudioPlaying) return 'rp';
    if (rpTrack)        return 'rp';     // RP is shown on screen → control RP
    if (spotifyTrack)   return 'spotify'; // paused Spotify cache → control Spotify
    return isAuthed() ? 'spotify' : 'rp';
  }

  document.getElementById('btn-playpause').addEventListener('click', async () => {
    const src = activePlaybackSource();

    if (src === 'rp') {
      if (rpAudioPlaying) {
        rpPause();
      } else {
        // If Spotify happens to be playing, pause it first to avoid double audio.
        if (isAuthed() && spotifyPlaying) {
          await spotifyApi('/me/player/pause', 'PUT');
          spotifyPlaying = false;
        }
        rpPlay();
      }
      render();
      return;
    }

    // Spotify
    if (!isAuthed()) { spotifyLogin(); return; }
    // If RP is playing locally, stop it before starting Spotify.
    if (rpAudioPlaying && !spotifyPlaying) rpPause();
    const path = spotifyPlaying ? '/me/player/pause' : '/me/player/play';
    const r = await spotifyApi(path, 'PUT');
    if (r && r.needsAuth) { spotifyLogin(); return; }
    spotifyPlaying = !spotifyPlaying;
    if (spotifyPlaying) {
      lastSource = 'spotify';
      localStorage.setItem('last_source', 'spotify');
    }
    render();
    setTimeout(pollSpotify, 700);
  });

  document.getElementById('btn-spotify').addEventListener('click', () => {
    lastSource = 'spotify';
    localStorage.setItem('last_source', 'spotify');
    window.location.href = 'spotify://';
  });

  document.getElementById('btn-rp').addEventListener('click', () => {
    lastSource = 'rp';
    localStorage.setItem('last_source', 'rp');
    // Radio Paradise app (BitLove Inc, App Store ID 517818306).
    // Try the most likely URL scheme first; if the app isn't installed or the
    // scheme doesn't match, fall back to the App Store page after a short delay.
    const APP_STORE_URL = 'https://apps.apple.com/us/app/radio-paradise/id517818306';
    const start = Date.now();
    let fellBack = false;
    const fallback = () => {
      if (fellBack) return;
      if (document.visibilityState === 'visible' && Date.now() - start < 2500) {
        fellBack = true;
        window.location.href = APP_STORE_URL;
      }
    };
    // If the app's URL scheme is registered, the page goes to the background
    // and visibilitychange fires — in that case we cancel the fallback.
    document.addEventListener('visibilitychange', () => { fellBack = true; }, { once: true });
    window.location.href = 'radioparadise://';
    setTimeout(fallback, 1500);
  });

  $signin.addEventListener('click', spotifyLogin);

  // ====== Init / OAuth callback handoff ======
  async function handleCallbackCode() {
    // Code may arrive via ?code=... (if redirect URI hits this page)
    // or via #code=... (handed off from /callback/ helper page).
    let code = null;
    const search = new URLSearchParams(window.location.search);
    const hash   = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    if (search.get('code')) code = search.get('code');
    else if (hash.get('code')) code = hash.get('code');

    if (code) {
      setStatus('Authorizing…');
      await exchangeCode(code);
      history.replaceState({}, '', window.location.pathname);
      setStatus('');
    }
  }

  async function init() {
    await handleCallbackCode();

    if (!isAuthed()) {
      $signin.classList.remove('hidden');
    } else {
      $signin.classList.add('hidden');
    }

    pollSpotify();
    pollRP();
    setInterval(pollSpotify, SPOTIFY_POLL_MS);
    setInterval(pollRP, RP_POLL_MS);

    // Keep the iPad screen awake while the page is visible (where supported).
    let wakeLock = null;
    async function requestWake() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) { /* user gesture may be required */ }
    }
    requestWake();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWake();
    });
    // Also retry on first user interaction (Safari often requires a gesture).
    document.addEventListener('click', requestWake, { once: true });

    render();
  }

  init();
})();
</script>
</body>
</html>
