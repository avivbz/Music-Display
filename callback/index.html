<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Authorizing…</title>
<style>
  html, body {
    height: 100%; margin: 0;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .msg { font-size: 4vh; opacity: 0.7; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="msg" id="msg">Authorizing…</div>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const code   = params.get('code');
    const error  = params.get('error');
    const msg    = document.getElementById('msg');

    if (error) {
      msg.textContent = 'Authorization error: ' + error;
      msg.className = 'msg err';
      return;
    }
    if (code) {
      // Hand the code back to the main app via URL hash, then redirect.
      window.location.replace('../#code=' + encodeURIComponent(code));
    } else {
      window.location.replace('../');
    }
  })();
</script>
</body>
</html>
